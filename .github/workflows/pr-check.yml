name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (Debug)
        run: |
          xcodebuild \
            -project CubeCleaner.xcodeproj \
            -scheme CubeCleaner \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build